<title>客戶 360 · 離線圖譜</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111d2f;--line:#25374c;--muted:#a1b4cb;--text:#edf4ff;--blue:#79b6ff;--mint:#64dec5}*{box-sizing:border-box}body{margin:0;font:14px/1.55 "Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button,select{color:var(--text);background:#1a2b40;border:1px solid #344963;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover,select:hover{border-color:var(--blue);background:#243b55}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:disabled{opacity:.4;cursor:default}header{height:90px;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);gap:20px}h1{font-size:23px;letter-spacing:.5px;margin:0}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--mint);font-weight:700;margin-bottom:3px}.subtitle{color:var(--muted);font-size:12px}.offline{color:var(--mint);border:1px solid #32594e;border-radius:24px;padding:5px 12px;white-space:nowrap;font-size:12px}.shell{display:grid;grid-template-columns:260px minmax(320px,1fr) 320px;height:calc(100vh - 126px);min-height:500px}.left,.right{background:var(--panel);overflow:auto;padding:20px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}label,.section-title{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.left select,.left input{width:100%}.left input{padding:10px 11px;background:#0b1525;border:1px solid #344963;border-radius:8px;color:var(--text)}.field{margin-bottom:20px}.count{font-size:11px;color:var(--muted);margin:10px 0}.result{display:block;width:100%;border:0;border-bottom:1px solid #25374c;border-radius:0;background:transparent;text-align:left;padding:10px 5px;overflow-wrap:anywhere}.result.active{background:#213c58}.result small{display:block;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;hei :#dceaff}.relation button:hover{color:var(--mint)}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.65 Consolas,"Microsoft JhengHei",monospace;color:#c5d4e7}.property{padding:8px 0;border-top:1px solid #233349}.property dt{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.property dd{margin:3px 0 0;font-size:12px;overflow-wrap:anywhere}.empty{color:var(--muted);padding:28px 0;font-size:13px}.tip{padding:13px;background:#172c3d;border-left:2px solid var(--mint);font-size:12px;color:#c5d8e8;margin:18px 0}.footer{height:36px;border-top:1px solid var(--line);padding:8px 20px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.zoom{margin-left:auto;display:flex;gap:5px}.no-results{padding:15px 3px;color:var(--muted)}@media(max-width:1100px){.shell{grid-template-columns:220px minmax(280px,1fr) 280px}.left,.right{padding:14px}.toolbar{left:10px;right:10px;top:10px}.toolbar button{padding:6px 7px}}@media(max-width:800px){header{height:auto;padding:15px}.shell{height:auto;grid-template-columns:1fr}.left{max-height:310px}.center{height:620px}.right{min-height:250px}.footer{height:auto;flex-wrap:wrap}.subtitle{max-width:240px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">CUSTOMER 360 / KNOWLEDGE GRAPH</div><h1>客戶 360 · 離線圖譜</h1><div class="subtitle">探索共通本體、私銀指標與資料來源</div></div><span class="offline">● 離線可用 · 單一檔案</span></header>
<main class="shell">
<aside class="left" aria-label="圖譜導覽">
<div class="field"><label for="view">圖譜範圍</label><select id="view"><option value="full">完整圖 · RDF ＋ 業務</option><option value="business">業務概念與來源</option><option value="securities">證券指標與來源</option><option value="ontology">本體類別</option></select></div>
<div class="legend"><span><i class="dot" style="background:#9fafff"></i>本體類別</span><span><i class="dot" style="background:#63d9c1"></i>指標</span><span><i class="dot" style="background:#eebd6a"></i>來源表</span><span><i class="dot" style="background:#71b9fa"></i>業務概念</span></div>
<div class="field"><label for="search">搜尋節點、定義或來源表</label><input id="search" type="search" placeholder="例如：證券總 AUM" autocomplete="off"></div>
<div class="field"><label for="relationFilter">畫布關係</label><select id="relationFilter"><option value="">全部關係</option></select></div>
<div id="resultCount" class="count" aria-live="polite"></div><div id="results"></div>
</aside>
<section class="center" aria-label="互動圖譜">
<div class="toolbar"><button id="all">顯示全圖</button><button id="focus">聚焦所選</button><button id="expand">展開一層</button><button id="fit">適合畫面</button><div class="zoom"><button id="zoomOut" aria-label="縮小">−</button><button id="zoomIn" aria-label="放大">＋</button></div></div>
<svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="可拖曳縮放的知識圖譜"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7590ac"/></marker></defs><g id="world"></g></svg>
<div class="graph-status"><div id="stats" aria-live="polite"></div><div>點選查看 · 雙擊展開 · 拖曳移動 · 滾輪縮放</div></div>
</section>
<aside id="inspector" class="right" aria-label="節點屬性"></aside>
</main>
<footer class="footer"><span>模型與來源描述；分項涵蓋不代表加總公式，類別對應不代表實例斷言。</span><span id="stamp"></span></footer>
<script id="graphData" type="application/json">__GRAPH_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('graphData').textContent);
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const typeNames={OntologyClass:'本體類別',Metric:'指標',SourceTable:'來源表',BusinessConcept:'業務概念',Department:'部門'};
const colors={OntologyClass:'#9fafff',Metric:'#63d9c1',SourceTable:'#eebd6a',BusinessConcept:'#71b9fa',Department:'#f399b8'};
const relationNames={USES_METRIC:'採用指標',HAS_COMPONENT_METRIC:'涵蓋分項',HAS_SOURCE_TABLE:'金額來源',USES_VALUATION_SOURCE:'估值來源',USES_DATE_LOOKUP_SOURCE:'日期來源',REFERS_TO_CLASS:'類別對應',RDF_SUBCLASS_OF:'類別繼承'};
let graph,byId,selected=null,visible=new Set(),positions=new Map(),camera={x:0,y:0,k:1},pointer=null,suppressClick=false,lastTap={id:null,time:0};
const name=n=>n.content||n.properties?.name||n.id;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
function svgEl(tag,attrs,text){const x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;return x;}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b;}
function allowedEdges(){const filter=$('relationFilter').value;return graph.edges.filter(e=>!filter||e.type===filter);}
function drawnEdges(){return allowedEdges().filter(e=>visible.has(e.source)&&visible.has(e.target));}
function neighbours(id){const ids=new Set([id]);for(const e of allowedEdges())if(e.source===id||e.target===id){ids.add(e.source);ids.add(e.target);}return ids;}
function focusLayout(){if(!selected||visible.size>50)return;positions.set(selected,{x:0,y:0});const outgoing=new Set(allowedEdges().filter(e=>e.source===selected).map(e=>e.target));const left=[...visible].filter(id=>id!==selected&&!outgoing.has(id)),right=[...visible].filter(id=>id!==selected&&outgoing.has(id));for(const [ids,x] of [[left,-240],[right,240]])ids.forEach((id,i)=>positions.set(id,{x,y:(i-(ids.length-1)/2)*85}));}
function focusSelected(){visible=neighbours(selected);focusLayout();render();inspect();list();fit();}
function applyCamera(){$('world').setAttribute('transform',`translate(${camera.x},${camera.y}) scale(${camera.k})`);for(const t of document.querySelectorAll('.node text')){t.style.fontSize=(visible.size<=20?12/camera.k:14)+'px';for(const [i,span] of [...t.children].entries())span.setAttribute('dy',i?(visible.size<=20?15/camera.k:16):0);}}
function layout(){
 const nodes=graph.nodes.map((n,i)=>{const a=i*2.39996323,r=45*Math.sqrt(i+1);return {id:n.id,x:Math.cos(a)*r,y:Math.sin(a)*r};});
 const map=new Map(nodes.map(n=>[n.id,n]));
 for(let step=0;step<250;step++){
  const force=nodes.map(()=>({x:0,y:0}));
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=Math.max(60,dx*dx+dy*dy),d=Math.sqrt(d2),f=3500/d2;force[i].x+=dx/d*f;force[i].y+=dy/d*f;force[j].x-=dx/d*f;force[j].y-=dy/d*f;}
  const idx=new Map(nodes.map((n,i)=>[n.id,i]));
  for(const e of graph.edges){const a=map.get(e.source),b=map.get(e.target);if(a===b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-140)*.018;force[idx.get(a.id)].x+=dx/d*f;force[idx.get(a.id)].y+=dy/d*f;force[idx.get(b.id)].x-=dx/d*f;force[idx.get(b.id)].y-=dy/d*f;}
  for(let i=0;i<nodes.length;i++){const n=nodes[i],f=force[i],cool=1-step/300;n.x+=Math.max(-12,Math.min(12,f.x-n.x*.001))*cool;n.y+=Math.max(-12,Math.min(12,f.y-n.y*.001))*cool;}
 }
 positions=new Map(nodes.map(n=>[n.id,{x:n.x,y:n.y}]));
}
function fit(){const pts=[...visible].map(id=>positions.get(id));if(!pts.length)return;const box=$('graph').getBoundingClientRect(),minX=Math.min(...pts.map(p=>p.x))-100,maxX=Math.max(...pts.map(p=>p.x))+230,minY=Math.min(...pts.map(p=>p.y))-55,maxY=Math.max(...pts.map(p=>p.y))+55;camera.k=Math.max(.1,Math.min(2.2,(box.width-45)/(maxX-minX),(box.height-150)/(maxY-minY)));camera.x=box.width/2-(minX+maxX)/2*camera.k;camera.y=(box.height+20)/2-(minY+maxY)/2*camera.k;applyCamera();}
function render(){
 const world=$('world');world.replaceChildren();const connected=selected?neighbours(selected):null,edges=drawnEdges();
 for(const e of edges){const a=positions.get(e.source),b=positions.get(e.target),dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),highlight=e.source===selected||e.target===selected;const line=svgEl('line',{x1:a.x+dx/d*10,y1:a.y+dy/d*10,x2:b.x-dx/d*13,y2:b.y-dy/d*13,class:'edge'+(highlight?' emphasis':''),'marker-end':'url(#arrow)'});line.append(svgEl('title',{},`${name(byId.get(e.source))} → ${e.type} → ${name(byId.get(e.target))}`));world.append(line);if(highlight&&edges.filter(x=>x.source===selected||x.target===selected).length<=12)world.append(svgEl('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,'text-anchor':'middle',class:'edge-label'},relationNames[e.type]||e.type));}
 for(const n of graph.nodes){if(!visible.has(n.id))continue;const p=positions.get(n.id),g=svgEl('g',{transform:`translate(${p.x},${p.y})`,class:'node'+(n.id===selected?' selected':'')+(connected&&!connected.has(n.id)?' dim':''),'data-id':n.id,tabindex:'0',role:'button','aria-label':name(n)});g.append(svgEl('circle',{r:n.id===selected?11:8,fill:colors[n.type]||'#71b9fa'}));const label=svgEl('text',{x:14,y:4});const short=name(n).replace(/^\u79c1\u9280[\uff0d\u2014-]/,'');for(let i=0;i<short.length;i+=14)label.append(svgEl('tspan',{x:14,dy:i?15:0},short.slice(i,i+14)));if(visible.size>65&&connected&&!connected.has(n.id))label.setAttribute('display','none');g.append(label);g.append(svgEl('title',{},`${name(n)}\n${n.id}`));g.onclick=()=>{if(!suppressClick)select(n.id);};g.ondblclick=e=>{e.stopPropagation();selected=n.id;expand();};g.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();select(n.id);}if(e.key===' '){e.preventDefault();selected=n.id;expand();}};g.onpointerdown=e=>startPointer(e,n.id);world.append(g);}
 applyCamera();$('stats').textContent=`顯示 ${visible.size} / ${graph.nodes.length} 節點 · ${edges.length} / ${graph.edges.length} 關係`;$('focus').disabled=!selected;$('expand').disabled=!selected;
}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const found=graph.nodes.filter(n=>!q||`${name(n)} ${n.id} ${JSON.stringify(n.properties)}`.toLocaleLowerCase().includes(q));$('resultCount').textContent=`${found.length} 個符合節點 · 點選聚焦相鄰關係`;$('results').replaceChildren();if(!found.length)$('results').append(el('div','沒有符合的節點。請試試其他名稱或切換圖譜範圍。','no-results'));for(const n of found){const b=button('',()=>{selected=n.id;focusSelected();});b.className='result'+(n.id===selected?' active':'');const dot=el('i',undefined,'dot');dot.style.background=colors[n.type]||'#71b9fa';b.append(dot,document.createTextNode(name(n)),el('small',typeNames[n.type]||n.type));$('results').append(b);}}
function inspect(){const panel=$('inspector');panel.replaceChildren();if(!selected){panel.append(el('div','圖譜導覽','eyebrow'),el('h2','從一個概念開始'),el('p','點選節點，查看定義、直接關係與原始屬性。搜尋結果可帶你聚焦到相關的小圖。','description'),el('div','四個視圖均已內嵌在此檔案，可在沒有網路與 Python 的環境使用。','tip'),el('p','此版本提供瀏覽功能；問答、即時推理及 Ontology Hub 編輯仍需原服務。','subtitle'));return;}
 const n=byId.get(selected);panel.append(el('div',typeNames[n.type]||n.type,'badge'),el('h2',name(n)),el('div',n.id,'id'));const p=n.properties||{};panel.append(el('p',p.definition||p.projection?.definition||'此節點未附文字定義。','description'));
 const actions=el('div',undefined,'actions');actions.append(button('展開一層',expand),button('只看相鄰',()=>{focusSelected();}));panel.append(actions);
 const props=el('dl');for(const key of ['subsidiary','scope','metric_kind','calculation_status','coverage_status','status','database_verified'])if(p[key]!==undefined){const row=el('div',undefined,'property');row.append(el('dt',key),el('dd',String(p[key])));props.append(row);}panel.append(props);
 const relations=graph.edges.filter(e=>e.source===selected||e.target===selected);panel.append(el('div',`直接關係 · ${relations.length}（本視圖全部類型）`,'section-title'));
 for(const e of relations){const outgoing=e.source===selected,other=byId.get(outgoing?e.target:e.source),row=el('div',undefined,'relation');row.append(el('small',`${outgoing?'→':'←'} ${relationNames[e.type]||e.type} · ${e.type}`),button(name(other),()=>{visible.add(other.id);select(other.id);fit();}));const detail=el('details');detail.append(el('summary','關係屬性'),el('pre',JSON.stringify(e,null,2)));row.append(detail);panel.append(row);}
 const details=el('details');details.append(el('summary','完整節點屬性（原始資料）'),el('pre',JSON.stringify(n,null,2)));panel.append(details);
}
function select(id){selected=id;render();inspect();list();}
function expand(){if(!selected)return;for(const id of neighbours(selected))visible.add(id);render();inspect();fit();}
function zoom(factor,x,y){const box=$('graph').getBoundingClientRect();x=x??box.width/2;y=y??box.height/2;const k=Math.max(.08,Math.min(6,camera.k*factor)),r=k/camera.k;camera.x=x-(x-camera.x)*r;camera.y=y-(y-camera.y)*r;camera.k=k;applyCamera();}
function startPointer(e,id){if(e.button!==0)return;e.stopPropagation();pointer={id,x:e.clientX,y:e.clientY,moved:false};suppressClick=false;$('graph').setPointerCapture(e.pointerId);}
$('graph').onpointerdown=e=>startPointer(e,null);
$('graph').onpointermove=e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>2)pointer.moved=true;if(pointer.id){const p=positions.get(pointer.id);p.x+=dx/camera.k;p.y+=dy/camera.k;render();}else{camera.x+=dx;camera.y+=dy;applyCamera();}pointer.x=e.clientX;pointer.y=e.clientY;};
function endPointer(){if(!pointer)return;suppressClick=pointer.moved;const clicked=pointer.id;pointer=null;if(clicked&&!suppressClick){const now=Date.now();if(lastTap.id===clicked&&now-lastTap.time<450){selected=clicked;expand();lastTap={id:null,time:0};}else{select(clicked);lastTap={id:clicked,time:now};}}setTimeout(()=>{suppressClick=false;},0);}
$('graph').onpointerup=endPointer;$('graph').onpointercancel=()=>{pointer=null;};
$('graph').addEventListener('wheel',e=>{e.preventDefault();const b=$('graph').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top);},{passive:false});
function loadView(){graph=DATA.views[$('view').value];byId=new Map(graph.nodes.map(n=>[n.id,n]));selected=null;visible=new Set(graph.nodes.map(n=>n.id));$('search').value='';$('relationFilter').replaceChildren(new Option('全部關係',''));for(const t of [...new Set(graph.edges.map(e=>e.type))].sort())$('relationFilter').add(new Option(relationNames[t]?`${relationNames[t]} · ${t}`:t,t));layout();list();render();inspect();fit();}
$('view').onchange=loadView;$('search').oninput=list;$('relationFilter').onchange=()=>{render();};$('all').onclick=()=>{visible=new Set(graph.nodes.map(n=>n.id));selected=null;layout();render();inspect();list();fit();};$('focus').onclick=()=>{if(selected){focusSelected();}};$('expand').onclick=expand;$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(1.3);$('zoomOut').onclick=()=>zoom(1/1.3);
window.addEventListener('resize',fit);$('stamp').textContent=`v0.16.0 · 匯出 ${DATA.exported}`;loadView();
</script>
</body></html>
