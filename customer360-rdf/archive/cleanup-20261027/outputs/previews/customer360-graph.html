  <script>
  (() => {
    const root = document.getElementById('c360-graph-preview');
    const data = JSON.parse(root.querySelector('#c360-data').textContent);
    const nodes = new Map(data.nodes.map(n => [n.id,n]));
    const edges = data.edges;
    const ns = 'http://www.w3.org/2000/svg';
    const views = root.querySelector('#c360-view');
    const overview = root.querySelector('#c360-overview');
    const detail = root.querySelector('#c360-detail');
    const title = root.querySelector('#c360-selection');
    const nodeId = root.querySelector('#c360-id');
    const status = root.querySelector('#c360-status');
    const metricUri = 'https://example.org/ontology/holding#Metric';
    let state = { view:'aum', selected:'securities.bond_aum' };
    let diagrams = [];
    let scheduled = false;

    function restore(saved) {
      const value = saved?.privateContent;
      if(value && ['aum','fee','rdf'].includes(value.view) && nodes.has(value.selected)) {
        state = {view:value.view,selected:value.selected};
      }
    }
    restore(window.openai?.widgetState);
    function remember() {
      if(window.openai?.setWidgetState) {
        const n=nodes.get(state.selected);
        window.openai.setWidgetState({modelContent:{view:state.view,selectedId:n.id,selectedName:n.name},privateContent:state}).catch(()=>{});
      }
    }
    function shortName(n) {
      return n.name.replace(/^私銀－證券/,'').replace(/^私銀－銀行/,'').replace('複委託','');
    }
    function node(n,container,action=true) {
      const wrap=document.createElement('div');
      wrap.className='node-wrap k-'+n.kind;
      const dot=document.createElement('span'); dot.className='dot'; dot.setAttribute('aria-hidden','true');
      const b=document.createElement('button'); b.type='button'; b.className='btn btn-block';
      b.textContent=shortName(n); b.dataset.nodeId=n.id;
      b.setAttribute('aria-label',n.name);
      b.setAttribute('aria-pressed',String(state.selected===n.id));
      b.setAttribute('data-tooltip',n.name);
      if(action) b.addEventListener('click',()=>select(n.id));
      wrap.append(dot,b); container.append(wrap); return b;
    }
    function column(container,label) {
      const col=document.createElement('div'); col.className='column';
      if(label) {const el=document.createElement('div');el.className='column-label text-small';el.textContent=label;col.append(el);}
      container.append(col); return col;
    }
    function makeDiagram(container,className) {
      container.replaceChildren();
      const svg=document.createElementNS(ns,'svg'); svg.classList.add('edges'); svg.setAttribute('aria-hidden','true');
      container.append(svg);
      const grid=document.createElement('div');grid.className=className;container.append(grid);
      const graph={container,grid,svg,links:[]};diagrams.push(graph);return graph;
    }
    function link(graph,from,to,aux=false,reverse=false) {graph.links.push({from,to,aux,reverse});}
    function redraw() {
      scheduled=false;
      for(const g of diagrams) {
        const box=g.container.getBoundingClientRect();
        g.svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
        g.svg.replaceChildren();
        const defs=document.createElementNS(ns,'defs');
        const marker=document.createElementNS(ns,'marker');
        marker.id=g.container.id+'-arrow';marker.setAttribute('viewBox','0 0 8 8');marker.setAttribute('refX','7');marker.setAttribute('refY','4');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');marker.setAttribute('orient','auto-start-reverse');
        const triangle=document.createElementNS(ns,'path');triangle.setAttribute('d','M 0 0 L 8 4 L 0 8 Z');triangle.setAttribute('fill','var(--muted-foreground)');marker.append(triangle);defs.append(marker);g.svg.append(defs);
        for(const l of g.links) {
          const a=l.from.getBoundingClientRect(),b=l.to.getBoundingClientRect();
          const stacked=Math.abs(a.left-b.left)<28;
          let d;
          if(stacked) {
            const x=Math.min(a.left,b.left)-box.left-13;
            const ay=a.top+a.height/2-box.top,by=b.top+b.height/2-box.top;
            d=`M ${a.left-box.left} ${ay} C ${x} ${ay}, ${x} ${ay}, ${x} ${ay+14} L ${x} ${by-14} C ${x} ${by}, ${x} ${by}, ${b.left-box.left-3} ${by}`;
          } else {
            const ax=a.right-box.left+2,ay=a.top+a.height/2-box.top;
            const bx=b.left-box.left-3,by=b.top+b.height/2-box.top;
            const dx=Math.max(12,(bx-ax)/2);
            d=`M ${ax} ${ay} C ${ax+dx} ${ay}, ${bx-dx} ${by}, ${bx} ${by}`;
          }
          const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.classList.add('edge');if(l.aux)p.classList.add('aux');
          p.setAttribute(l.reverse?'marker-start':'marker-end',`url(#${marker.id})`);g.svg.append(p);
        }
      }
    }
    function schedule() {if(!scheduled){scheduled=true;requestAnimationFrame(redraw);}}
    const resize = new ResizeObserver(schedule); resize.observe(root);
    function drawOverview() {
      const g=makeDiagram(overview,'columns');
      if(state.view==='rdf') {
        const left=column(g.grid,'共通指標');const center=column(g.grid,'指標類別');const right=column(g.grid,'子公司類別');
        const rootNode=node(nodes.get(metricUri),left);
        const children=edges.filter(e=>e.k==='RDF_SUBCLASS_OF'&&e.t===metricUri).sort((a,b)=>nodes.get(a.s).name.localeCompare(nodes.get(b.s).name,'zh-Hant'));
        children.forEach(e=>{
          const parent=node(nodes.get(e.s),center);link(g,rootNode,parent,false,true);
          const kids=edges.filter(x=>x.k==='RDF_SUBCLASS_OF'&&x.t===e.s);
          kids.forEach(x=>{const child=node(nodes.get(x.s),right);link(g,parent,child,false,true);});
        });
        overview.setAttribute('aria-label','RDF 指標類別的直接繼承關係，箭頭由子類指向父類');
      } else {
        const total=state.view==='aum'?'securities.total_aum':'securities.total_fee_income';
        const a=column(g.grid,'部門');const b=column(g.grid,'採用指標');const c=column(g.grid,'涵蓋分項');
        const dept=node(nodes.get('bank.private_banking'),a);
        const sum=node(nodes.get(total),b);link(g,dept,sum);
        const parts=edges.filter(e=>e.s===total&&e.k==='HAS_COMPONENT_METRIC');
        parts.forEach(e=>{const part=node(nodes.get(e.t),c);link(g,sum,part);});
        overview.setAttribute('aria-label','私銀採用證券總指標，總指標涵蓋商品分項；涵蓋關係不代表加總公式');
      }
    }
    function drawDetail() {
      const n=nodes.get(state.selected);
      title.textContent=n.name;nodeId.textContent=n.id;
      const g=makeDiagram(detail,'detail-columns');
      const a=column(g.grid,'選定節點'),b=column(g.grid,'相鄰節點');
      const selected=node(n,a);
      let neighbors=[];
      if(n.kind==='Metric') {
        const labels={REFERS_TO_CLASS:'RDF 類別',HAS_SOURCE_TABLE:'金額來源',USES_VALUATION_SOURCE:'估值輔助',USES_DATE_LOOKUP_SOURCE:'日期查詢',HAS_COMPONENT_METRIC:'涵蓋分項'};
        const order=Object.keys(labels);
        neighbors=edges.filter(e=>e.s===n.id&&labels[e.k]).map(e=>({e,n:nodes.get(e.t),label:labels[e.k],order:order.indexOf(e.k),reverse:false}));
        status.textContent=n.id.includes('.total_')?'涵蓋目前已納入的分項 · 計算口徑待 Tool 定義':'來源狀態：檔案觀察 · 實體欄位映射待確認';
      } else if(n.kind==='OntologyClass') {
        neighbors=edges.filter(e=>e.k==='RDF_SUBCLASS_OF'&&(e.s===n.id||e.t===n.id)).map(e=>({e,n:nodes.get(e.s===n.id?e.t:e.s),label:e.s===n.id?'繼承自':'子類別',order:e.s===n.id?0:1,reverse:e.t===n.id}));
        const rel=edges.filter(e=>e.k.startsWith('RDF_DECLARED_')&&(e.s===n.id||e.t===n.id));
        neighbors.push(...rel.map(e=>({e,n:nodes.get(e.s===n.id?e.t:e.s),label:e.label+' · 宣告',order:2,reverse:e.t===n.id})));
        status.textContent='RDF schema 宣告 · 虛線為 domain／range 視覺化關係';
      } else if(n.kind==='SourceTable') {
        const labels={HAS_SOURCE_TABLE:'作為金額來源',USES_VALUATION_SOURCE:'作為估值輔助',USES_DATE_LOOKUP_SOURCE:'作為日期查詢'};
        neighbors=edges.filter(e=>e.t===n.id&&labels[e.k]).map(e=>({e,n:nodes.get(e.s),label:labels[e.k],order:0,reverse:true}));
        status.textContent='來源狀態：observed_in_files · database_verified=false';
      } else {
        neighbors=edges.filter(e=>e.s===n.id&&e.k==='USES_METRIC'&&nodes.get(e.t)?.subsidiary==='securities').map(e=>({e,n:nodes.get(e.t),label:'採用指標',order:0,reverse:false}));
        status.textContent='私銀採用的證券指標範圍';
      }
      neighbors.sort((x,y)=>x.order-y.order||x.n.name.localeCompare(y.n.name,'zh-Hant'));
      neighbors.forEach(x=>{
        const row=document.createElement('div');row.className='neighbor';
        const label=document.createElement('div');label.className='neighbor-label text-small';label.textContent=x.label;
        label.setAttribute('data-tooltip',x.e.k);row.append(label);b.append(row);
        const neighbor=node(x.n,row);
        link(g,selected,neighbor,x.e.k.startsWith('RDF_DECLARED_')||x.e.k.startsWith('USES_'),x.reverse);
      });
      if(!neighbors.length) {const empty=document.createElement('div');empty.className='text-small text-muted';empty.textContent='此預覽未展開其他關係';b.append(empty);}
    }
    function render() {
      diagrams=[];views.value=state.view;drawOverview();drawDetail();schedule();
    }
    function select(id) {
      state.selected=id;
      if(nodes.get(id).kind==='OntologyClass')state.view='rdf';
      render();remember();
    }
    views.addEventListener('change',()=>{
      state.view=views.value;
      state.selected=state.view==='aum'?'securities.bond_aum':state.view==='fee'?'securities.foreign_stock_fee_income':'https://example.org/ontology/securities#SecuritiesAUM';
      render();remember();
    });
    window.addEventListener('openai:set_globals',event=>{
      if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}
    });
    render();
  })();
  </script>
</div>
